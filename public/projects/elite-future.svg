<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ef-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0e1b1d"/>
    </linearGradient>
    <linearGradient id="ef-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ef-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ef-bg)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.06">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="280" cy="220" r="160" fill="#10b981" opacity="0.14"/>
  <circle cx="600" cy="240" r="160" fill="#f97316" opacity="0.13"/>

  <!-- Candlestick Trading Terminal -->
  <rect x="80" y="80" width="410" height="260" rx="20" fill="#0b0f19" stroke="#10b981" stroke-width="1.5"/>

  <!-- Chart Header -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="125" fill="#f8fafc" font-size="16" font-weight="bold">BTC / USDT Trading View</text>
    <rect x="360" y="108" width="105" height="24" rx="6" fill="#10b981" opacity="0.15"/>
    <text x="412" y="124" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Bullish Trend</text>
  </g>

  <!-- Candlestick Bars & Wicks -->
  <line x1="130" y1="200" x2="130" y2="280" stroke="#10b981" stroke-width="2"/>
  <rect x="122" y="220" width="16" height="40" rx="2" fill="url(#ef-green)"/>

  <line x1="170" y1="210" x2="170" y2="270" stroke="#ef4444" stroke-width="2"/>
  <rect x="162" y="230" width="16" height="30" rx="2" fill="url(#ef-red)"/>

  <line x1="210" y1="180" x2="210" y2="260" stroke="#10b981" stroke-width="2"/>
  <rect x="202" y="195" width="16" height="45" rx="2" fill="url(#ef-green)"/>

  <line x1="250" y1="150" x2="250" y2="230" stroke="#10b981" stroke-width="2"/>
  <rect x="242" y="165" width="16" height="50" rx="2" fill="url(#ef-green)"/>

  <line x1="290" y1="170" x2="290" y2="240" stroke="#ef4444" stroke-width="2"/>
  <rect x="282" y="180" width="16" height="35" rx="2" fill="url(#ef-red)"/>

  <line x1="330" y1="120" x2="330" y2="210" stroke="#10b981" stroke-width="2"/>
  <rect x="322" y="135" width="16" height="60" rx="2" fill="url(#ef-green)"/>

  <line x1="370" y1="100" x2="370" y2="180" stroke="#10b981" stroke-width="2"/>
  <rect x="362" y="110" width="16" height="55" rx="2" fill="url(#ef-green)"/>

  <!-- Moving Average Line -->
  <path d="M 120,240 Q 200,210 270,180 T 420,110" fill="none" stroke="#f97316" stroke-width="3"/>
  <circle cx="420" cy="110" r="4" fill="#f97316"/>

  <!-- Right Investment Portfolio & Trading Stats -->
  <g transform="translate(515, 80)" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="205" height="120" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
    <text x="20" y="35" fill="#94a3b8" font-size="11" font-weight="bold">PORTFOLIO YIELD</text>
    <text x="20" y="68" fill="#34d399" font-size="22" font-weight="bold">+324.8%</text>
    <text x="20" y="95" fill="#f8fafc" font-size="12">24h Volume: $4.2M</text>

    <rect x="0" y="140" width="205" height="120" rx="16" fill="#0b0f19" stroke="#f97316" stroke-width="1.5"/>
    <text x="20" y="175" fill="#fbbf24" font-size="11" font-weight="bold">TRADE EXECUTION</text>
    <text x="20" y="208" fill="#f8fafc" font-size="16" font-weight="bold">High-Speed API</text>
    <rect x="20" y="222" width="165" height="24" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="102" y="238" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Ultra-Low Latency</text>
  </g>

  <!-- Bottom Badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">
    <rect x="80" y="380" width="190" height="46" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
    <circle cx="106" cy="403" r="10" fill="#10b981" opacity="0.2"/>
    <circle cx="106" cy="403" r="5" fill="#10b981"/>
    <text x="126" y="408">Trading Engine</text>

    <rect x="295" y="380" width="210" height="46" rx="12" fill="#0b0f19" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="321" cy="403" r="10" fill="#f97316" opacity="0.2"/>
    <circle cx="321" cy="403" r="5" fill="#f97316"/>
    <text x="341" y="408">Investment Growth</text>

    <rect x="530" y="380" width="190" height="46" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
    <circle cx="556" cy="403" r="10" fill="#38bdf8" opacity="0.2"/>
    <circle cx="556" cy="403" r="5" fill="#38bdf8"/>
    <text x="576" y="408">Secure Vault Core</text>
  </g>
</svg>
