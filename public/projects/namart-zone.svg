<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="nz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#190e1b"/>
    </linearGradient>
    <linearGradient id="nz-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#nz-bg)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.06">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="280" cy="220" r="160" fill="#ec4899" opacity="0.12"/>
  <circle cx="560" cy="240" r="160" fill="#f97316" opacity="0.14"/>

  <!-- Main Retail Showcase -->
  <rect x="80" y="80" width="410" height="260" rx="20" fill="#0b0f19" stroke="url(#nz-pink)" stroke-width="1.5"/>

  <!-- Header -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="125" fill="#f8fafc" font-size="16" font-weight="bold">Online Retail &amp; Storefront</text>
    <rect x="360" y="108" width="105" height="24" rx="6" fill="#f97316" opacity="0.15"/>
    <text x="412" y="124" fill="#fb923c" font-size="11" font-weight="bold" text-anchor="middle">Fast Delivery</text>
  </g>

  <!-- Product 1 -->
  <g transform="translate(110, 150)" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="165" height="155" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="135" height="70" rx="8" fill="#0f172a"/>
    <circle cx="82" cy="50" r="20" fill="#f97316" opacity="0.2"/>
    <polygon points="82,40 74,54 82,54 82,62 90,48 82,48" fill="#f97316"/>
    <text x="15" y="105" fill="#f8fafc" font-size="12" font-weight="bold">Premium Store Item</text>
    <text x="15" y="125" fill="#34d399" font-size="13" font-weight="bold">$120.00</text>
    <circle cx="140" cy="120" r="12" fill="#f97316"/>
    <text x="140" y="124" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">+</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(295, 150)" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="165" height="155" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="135" height="70" rx="8" fill="#0f172a"/>
    <circle cx="82" cy="50" r="20" fill="#38bdf8" opacity="0.2"/>
    <polygon points="82,40 74,54 82,54 82,62 90,48 82,48" fill="#38bdf8"/>
    <text x="15" y="105" fill="#f8fafc" font-size="12" font-weight="bold">Wireless Audio Pro</text>
    <text x="15" y="125" fill="#34d399" font-size="13" font-weight="bold">$85.00</text>
    <circle cx="140" cy="120" r="12" fill="#f97316"/>
    <text x="140" y="124" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">+</text>
  </g>

  <!-- Right Order Tracking & Shopping Bag Hub -->
  <g transform="translate(515, 80)" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="205" height="120" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
    <text x="20" y="35" fill="#94a3b8" font-size="11" font-weight="bold">CART STATUS</text>
    <text x="20" y="68" fill="#f8fafc" font-size="18" font-weight="bold">3 Items in Cart</text>
    <text x="20" y="95" fill="#fbbf24" font-size="12">Promo Applied (-20%)</text>

    <rect x="0" y="140" width="205" height="120" rx="16" fill="#0b0f19" stroke="#f97316" stroke-width="1.5"/>
    <text x="20" y="175" fill="#f97316" font-size="11" font-weight="bold">EXPRESS DISPATCH</text>
    <text x="20" y="208" fill="#f8fafc" font-size="16" font-weight="bold">Live GPS Tracking</text>
    <rect x="20" y="222" width="165" height="24" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="102" y="238" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Out for Delivery</text>
  </g>

  <!-- Bottom Badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">
    <rect x="80" y="380" width="190" height="46" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
    <circle cx="106" cy="403" r="10" fill="#f97316" opacity="0.2"/>
    <circle cx="106" cy="403" r="5" fill="#f97316"/>
    <text x="126" y="408">E-Commerce Retail</text>

    <rect x="295" y="380" width="210" height="46" rx="12" fill="#0b0f19" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="321" cy="403" r="10" fill="#ec4899" opacity="0.2"/>
    <circle cx="321" cy="403" r="5" fill="#ec4899"/>
    <text x="341" y="408">Order Tracking</text>

    <rect x="530" y="380" width="190" height="46" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
    <circle cx="556" cy="403" r="10" fill="#38bdf8" opacity="0.2"/>
    <circle cx="556" cy="403" r="5" fill="#38bdf8"/>
    <text x="576" y="408">Instant Gateways</text>
  </g>
</svg>
